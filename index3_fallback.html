<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Робот (заглушка) – без ИИ</title>
  <style>
    /* ===== ПОЛНЫЕ СТИЛИ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0b0e14;
      color: #e4e7ed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app {
      max-width: 800px;
      width: 100%;
      background: #141a24;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #f0f4ff;
    }
    .sub {
      color: #9aa5b5;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .input-area {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .input-area input {
      flex: 1;
      padding: 14px 18px;
      background: #0f151f;
      border: 1px solid #2a3345;
      border-radius: 14px;
      color: #e4e7ed;
      font-size: 16px;
      outline: none;
      min-width: 200px;
      transition: border-color 0.2s;
    }
    .input-area input:focus {
      border-color: #5f7ef0;
    }
    .input-area button {
      padding: 14px 32px;
      background: #5f7ef0;
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .input-area button:hover:not(:disabled) {
      background: #4b6ad9;
      transform: scale(1.02);
    }
    .input-area button:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }
    .canvas-wrap {
      background: #0f151f;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    canvas {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1/1;
      background: #1a212c;
      border-radius: 12px;
      display: block;
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 40px;
    }
    .status-msg {
      color: #b0bac8;
      font-size: 15px;
      flex: 1;
      transition: color 0.2s;
    }
    .status-msg.error {
      color: #f77;
    }
    .status-msg.success {
      color: #8cf0a0;
    }
    .status-msg.loading {
      color: #f0d070;
    }
    .btn-reset {
      background: #2d3748;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      color: #c8d0dc;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn-reset:hover {
      background: #3f4a60;
    }
    /* Подсказка для примера */
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #6a7688;
      background: #0f151f;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #1f2838;
    }
    .hint code {
      background: #1a212c;
      padding: 2px 8px;
      border-radius: 6px;
      color: #d4dce6;
    }
    @media (max-width: 500px) {
      .app { padding: 16px; }
      .input-area { flex-direction: column; }
      .input-area input { min-width: auto; }
      .input-area button { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>🤖 Командир робота (заглушка)</h1>
  <div class="sub">Введи команду на русском – робот выполнит (без ИИ, локальный парсер)</div>

  <div class="input-area">
    <input type="text" id="commandInput" placeholder="Например: вперёд 2, направо, стоп" />
    <button id="executeBtn">🚀 Выполнить</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="robotCanvas" width="500" height="500"></canvas>
  </div>

  <div class="status">
    <div id="statusMsg" class="status-msg">Готов</div>
    <button class="btn-reset" id="resetBtn">🔄 Сбросить</button>
  </div>

  <div class="hint">
    💡 <strong>Примеры команд:</strong>
    <code>вперёд 3</code> · <code>направо</code> · <code>налево</code> · <code>стоп</code> ·
    <code>вперёд 2, направо, вперёд 1</code>
  </div>
</div>

<script>
  // ============================================================
  //  ВЕСЬ JS – логика робота + локальный парсер (без вызова API)
  // ============================================================
  (function() {
    // --- Элементы ---
    const canvas = document.getElementById('robotCanvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('statusMsg');
    const inputField = document.getElementById('commandInput');
    const executeBtn = document.getElementById('executeBtn');
    const resetBtn = document.getElementById('resetBtn');

    // --- Параметры сетки ---
    const size = 500;
    const cellSize = 50;   // 10x10
    const cols = 10, rows = 10;

    // --- Состояние робота ---
    let robotX = 0, robotY = 0;          // текущие координаты (клетки)
    let direction = 1;                   // 0=вверх, 1=вправо, 2=вниз, 3=влево
    let trail = [{x: 0, y: 0}];          // массив пройденных клеток (след)
    let isAnimating = false;

    // ===== Отрисовка =====
    function draw() {
      ctx.clearRect(0, 0, size, size);

      // Сетка
      ctx.strokeStyle = '#2a3345';
      ctx.lineWidth = 1;
      for (let i = 0; i <= cols; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(size, i * cellSize);
        ctx.stroke();
      }

      // След (линии)
      if (trail.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#5f7ef0';
        ctx.lineWidth = 4;
        ctx.moveTo(trail[0].x * cellSize + cellSize/2, trail[0].y * cellSize + cellSize/2);
        for (let i = 1; i < trail.length; i++) {
          ctx.lineTo(trail[i].x * cellSize + cellSize/2, trail[i].y * cellSize + cellSize/2);
        }
        ctx.stroke();
      }

      // Робот (квадратик)
      const cx = robotX * cellSize + cellSize/2;
      const cy = robotY * cellSize + cellSize/2;
      const half = cellSize * 0.35;
      ctx.fillStyle = '#8cf0a0';
      ctx.shadowColor = '#8cf0a0';
      ctx.shadowBlur = 12;
      ctx.fillRect(cx - half, cy - half, half*2, half*2);
      ctx.shadowBlur = 0;

      // Глаз (показывает направление)
      ctx.fillStyle = '#0b0e14';
      let dx = 0, dy = 0;
      if (direction === 0) dy = -1;
      else if (direction === 1) dx = 1;
      else if (direction === 2) dy = 1;
      else if (direction === 3) dx = -1;
      ctx.beginPath();
      ctx.arc(cx + dx * half*0.7, cy + dy * half*0.7, 6, 0, 2 * Math.PI);
      ctx.fill();

      // Координаты (для отладки)
      ctx.fillStyle = '#9aa5b5';
      ctx.font = '12px monospace';
      ctx.fillText(`(${robotX},${robotY})`, 8, 20);
    }

    // ===== Движение с анимацией (по одной команде) =====
    function moveRobot(cmd) {
      return new Promise((resolve) => {
        const type = cmd.cmd;
        const n = cmd.n || 1;

        if (type === 'forward') {
          let steps = n;
          const interval = setInterval(() => {
            if (steps <= 0) {
              clearInterval(interval);
              resolve();
              return;
            }
            let nx = robotX, ny = robotY;
            if (direction === 0) ny--;
            else if (direction === 1) nx++;
            else if (direction === 2) ny++;
            else if (direction === 3) nx--;

            // Проверка границ
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) {
              clearInterval(interval);
              statusMsg.textContent = '⚠️ Стена! Робот не может двигаться дальше.';
              statusMsg.className = 'status-msg error';
              resolve();
              return;
            }
            robotX = nx;
            robotY = ny;
            trail.push({x: robotX, y: robotY});
            draw();
            steps--;
          }, 400);  // скорость анимации
        } else if (type === 'left') {
          direction = (direction + 3) % 4;
          draw();
          setTimeout(resolve, 300);
        } else if (type === 'right') {
          direction = (direction + 1) % 4;
          draw();
          setTimeout(resolve, 300);
        } else if (type === 'stop') {
          statusMsg.textContent = '🛑 Стоп. Робот остановлен.';
          statusMsg.className = 'status-msg';
          setTimeout(resolve, 300);
        } else {
          resolve();
        }
      });
    }

    // ===== Запуск цепочки команд =====
    async function runCommands(commands) {
      if (isAnimating) return;
      isAnimating = true;
      executeBtn.disabled = true;
      statusMsg.textContent = '⏳ Выполняю команды...';
      statusMsg.className = 'status-msg loading';

      for (const cmd of commands) {
        await moveRobot(cmd);
        // Если произошла ошибка стены – прерываем
        if (statusMsg.className.includes('error')) break;
      }

      if (!statusMsg.className.includes('error')) {
        statusMsg.textContent = '✅ Все команды выполнены!';
        statusMsg.className = 'status-msg success';
      }
      isAnimating = false;
      executeBtn.disabled = false;
    }

    // ===== ЛОКАЛЬНЫЙ ПАРСЕР (ЗАГЛУШКА) =====
    // Разбирает русские фразы на команды без обращения к ИИ
    function parseCommands(phrase) {
      const lower = phrase.toLowerCase();
      const commands = [];

      // Разбиваем по запятым, "и", точке с запятой
      const parts = lower.split(/[,;и]+/).map(s => s.trim()).filter(s => s.length > 0);

      if (parts.length === 0) {
        // Если ничего не разбилось – попробуем найти числа отдельно
        const numbers = lower.match(/\d+/g);
        if (numbers) {
          for (let num of numbers) {
            commands.push({cmd: 'forward', n: parseInt(num)});
          }
        } else {
          // Иначе просто двигаемся вперёд на 1
          commands.push({cmd: 'forward', n: 1});
        }
        return commands;
      }

      for (let part of parts) {
        if (part.includes('стоп')) {
          commands.push({cmd: 'stop'});
          continue;
        }
        if (part.includes('направо') || part.includes('вправо') || part.includes('прав')) {
          commands.push({cmd: 'right'});
          continue;
        }
        if (part.includes('налево') || part.includes('влево') || part.includes('лев')) {
          commands.push({cmd: 'left'});
          continue;
        }
        if (part.includes('вперёд') || part.includes('вперед') || part.includes('впер')) {
          // Ищем число в этой части
          const match = part.match(/(\d+)/);
          const n = match ? parseInt(match[1]) : 1;
          commands.push({cmd: 'forward', n: n});
          continue;
        }
        // Если ничего не распознано – игнорируем эту часть
      }

      // Если не нашли ни одной команды – добавим движение вперёд на 1
      if (commands.length === 0) {
        commands.push({cmd: 'forward', n: 1});
      }
      return commands;
    }

    // ===== Обработчик кнопки =====
    async function handleCommand() {
      const phrase = inputField.value.trim();
      if (!phrase) {
        statusMsg.textContent = 'Введите команду!';
        statusMsg.className = 'status-msg error';
        return;
      }
      if (isAnimating) {
        statusMsg.textContent = '⏳ Дождитесь окончания анимации';
        statusMsg.className = 'status-msg loading';
        return;
      }

      const commands = parseCommands(phrase);
      if (commands.length === 0) {
        statusMsg.textContent = 'Не удалось распознать команду. Попробуйте "вперёд 2, направо"';
        statusMsg.className = 'status-msg error';
        return;
      }
      await runCommands(commands);
    }

    // ===== Сброс =====
    function resetRobot() {
      if (isAnimating) return;
      robotX = 0;
      robotY = 0;
      direction = 1;
      trail = [{x: 0, y: 0}];
      draw();
      statusMsg.textContent = '🔄 Робот сброшен в начало';
      statusMsg.className = 'status-msg';
    }

    // ===== Навешиваем события =====
    executeBtn.addEventListener('click', handleCommand);
    resetBtn.addEventListener('click', resetRobot);
    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleCommand();
    });

    // ===== Стартовая отрисовка =====
    draw();
    statusMsg.textContent = 'Готов к командам';
  })();
</script>
</body>
</html>
